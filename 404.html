<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 ─ Page Not Found ─ Devarsh Vinod</title>
  <meta name="description" content="The requested page could not be found." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" href="DV.png" />

  <script>
    (function () {
      var path = window.location.pathname;
      var baseHref = path.indexOf("/My-Portfolio/") !== -1 ? "/My-Portfolio/" : "/";
      var b = document.createElement("base");
      b.href = baseHref;
      document.head.insertBefore(b, document.head.firstChild);
    })();
  </script>

  <!-- Typographic Stack -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/src/styles/main.css" />
</head>

<body
  class="bg-[#080808] text-white min-h-dvh flex flex-col justify-between p-6 md:p-16 antialiased selection:bg-white selection:text-black">
  <!-- Top Bar -->
  <header class="flex justify-between items-center border-b border-neutral-800 pb-6">
    <a href="./" class="font-serif text-xl tracking-tight text-white hover:opacity-80 transition-opacity">
      <span class="font-normal">DV</span>
      <span class="font-mono text-xs text-neutral-500 ml-2">2026</span>
    </a>
    <span class="font-mono text-xs uppercase tracking-widest text-neutral-500">HTTP Error 404</span>
  </header>

  <!-- Center Message -->
  <main class="my-auto max-w-xl py-12 space-y-6">
    <span class="font-mono text-xs text-neutral-500 uppercase tracking-widest block">
      Nothing to see here...
    </span>
    <h1 class="font-serif text-4xl sm:text-5xl md:text-6xl text-white font-normal leading-tight">
      Page Not Found
    </h1>
    <p class="font-sans text-sm md:text-base text-neutral-400 font-light leading-relaxed">
      The requested URL or portfolio section does not exist, has migrated, or is currently unavailable.
    </p>
    <div class="pt-4">
      <a href="./"
        class="to-link-underline inline-flex items-center gap-2 font-sans text-xs uppercase tracking-wider text-white border border-neutral-800 hover:border-neutral-700 bg-neutral-900/60 hover:bg-neutral-800 px-5 py-3 rounded-lg transition-colors">
        <span>← Return</span>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-neutral-800 pt-6 flex justify-between items-center text-xs text-neutral-500 font-sans">
    <span>Devarsh Vinod</span>
    <span class="font-mono text-neutral-600">DVRSH.COM</span>
  </footer>
</body>

</html>
